[build]
  command = "npm run build"
  publish = "dist"

# öffentliche Werte, die im Code und im Browser-Bundle stehen dürfen – der Secrets-Scan soll sie nicht melden
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_MYZEL_BACKEND,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_VAPID_PUBLIC_KEY,VITE_MEINVEREIN_URL,VAPID_SUBJECT,APP_URL,TELEGRAM_BOT_USERNAME"

# Server-Funktionen (Schritt C): netlify/functions ruft den Code in server/ auf
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# lokal mit echtem Backend: `npx netlify dev` startet Vite und die Functions zusammen auf http://localhost:8888;
# `npm run dev` allein bleibt die Vorschau mit Testdaten
[dev]
  framework = "vite"
  command = "npm run dev:backend"
  targetPort = 5173
  port = 8888

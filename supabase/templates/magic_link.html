<!-- Anmelde-Mail (WF-LOG-02, Phase 14): Link und Code. Im Supabase-Dashboard unter Authentication › Email Templates ›
     Magic Link einfügen (Betreff: „Deine Anmeldung bei Myzel“). Der Code ist für die App auf dem iPhone-Home-Bildschirm:
     iOS öffnet Links aus Mails immer im Browser, nicht in der installierten App. -->
<h2>Anmelden bei Myzel</h2>
<p><a href="{{ .ConfirmationURL }}">Hier tippen, um dich anzumelden</a></p>
<p>Myzel liegt auf deinem Home-Bildschirm? Dann gib in der App stattdessen diesen Code ein:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px; font-family: monospace">{{ .Token }}</p>
<p>
  Link und Code gelten eine Stunde und nur einmal. Wenn du keine Anmeldung angefordert hast, ignoriere diese
  Mail.
</p>
